name: joker-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: joker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: joker
      POSTGRES_USER: joker
      POSTGRES_PASSWORD: joker_local_password
    ports:
      - "5432:5432"
    volumes:
      - joker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joker -d joker"]
      interval: 5s
      timeout: 3s
      retries: 12

  webhook-proxy:
    image: nginx:1.27-alpine
    container_name: joker-webhook-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - ./infra/whatsapp-webhook.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: joker-cloudflared
    restart: unless-stopped
    depends_on:
      - webhook-proxy
    command: tunnel --no-autoupdate --url http://webhook-proxy:80

volumes:
  joker_postgres_data:
